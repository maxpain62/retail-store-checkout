apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metadata.labels.app }}-service
  labels:
    app: {{ .Values.metadata.labels.app }}
spec:
  selector:
    app: {{ .Values.metadata.labels.app }}
  ports:
    - port: {{ .Values.containers.ports.containerPort }}
      targetPort: {{ .Values.containers.ports.containerPort }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.metadata.labels.app }}-redis-service
  labels:
    app: {{ .Values.metadata.labels.app }}-redis
spec:
  selector:
    app: {{ .Values.metadata.labels.app }}-redis
  type: ClusterIP
  ports:
    - port: 6379
      protocol: TCP
      name: redis-port
